<svg width="720" height="460" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI','Arial',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040c18"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <radialGradient id="solNode" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="ethNode" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="baseNode" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </radialGradient>
    <radialGradient id="arbNode" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#082f49"/>
    </radialGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f87171"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fb923c"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="url(#bg)"/>

  <!-- title -->
  <text x="360" y="28" fill="#1e40af" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="4">NEXUS · CROSS-CHAIN BRIDGE MONITOR</text>
  <text x="360" y="48" fill="#93c5fd" font-size="18" font-weight="700" text-anchor="middle">Live Bridge Flow Map</text>
  <text x="360" y="68" fill="#1e3a8a" font-size="11" text-anchor="middle">last 2 hours · wormhole · 47 transfers · $12.4M total volume</text>

  <!-- ── SOLANA node (center-left, prominent) ── -->
  <circle cx="240" cy="240" r="52" fill="url(#solNode)" stroke="#3b82f6" stroke-width="2" filter="url(#nodeGlow)"/>
  <circle cx="240" cy="240" r="52" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.4"/>
  <text x="240" y="233" fill="#bfdbfe" font-size="15" font-weight="700" text-anchor="middle">Solana</text>
  <text x="240" y="252" fill="#93c5fd" font-size="12" text-anchor="middle">SOL</text>
  <text x="240" y="268" fill="#3b82f6" font-size="10" text-anchor="middle">+$4.2M net</text>

  <!-- ── ETHEREUM node (top right) ── -->
  <circle cx="530" cy="140" r="42" fill="url(#ethNode)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <text x="530" y="135" fill="#ddd6fe" font-size="14" font-weight="700" text-anchor="middle">Ethereum</text>
  <text x="530" y="153" fill="#a78bfa" font-size="11" text-anchor="middle">ETH</text>
  <text x="530" y="167" fill="#6d28d9" font-size="10" text-anchor="middle">−$3.1M net</text>

  <!-- ── BASE node (bottom right) ── -->
  <circle cx="530" cy="340" r="38" fill="url(#baseNode)" stroke="#0ea5e9" stroke-width="1.5" filter="url(#nodeGlow)"/>
  <text x="530" y="334" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Base</text>
  <text x="530" y="350" fill="#38bdf8" font-size="10" text-anchor="middle">−$1.1M net</text>

  <!-- ── ARBITRUM node (far right) ── -->
  <circle cx="648" cy="240" r="34" fill="url(#arbNode)" stroke="#0284c7" stroke-width="1" filter="url(#nodeGlow)"/>
  <text x="648" y="235" fill="#7dd3fc" font-size="12" font-weight="700" text-anchor="middle">Arbitrum</text>
  <text x="648" y="250" fill="#0ea5e9" font-size="10" text-anchor="middle">−$0.4M net</text>

  <!-- ── FLOW ARROWS ── -->

  <!-- ETH → SOL (large inflow, cyan, wide) -->
  <line x1="492" y1="162" x2="288" y2="218" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrowGreen)" filter="url(#lineGlow)" opacity="0.9"/>
  <rect x="356" y="175" width="84" height="20" rx="10" fill="#082f49"/>
  <text x="398" y="189" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">$5.2M →</text>

  <!-- SOL → ETH (outflow, smaller, red dashed) -->
  <line x1="286" y1="212" x2="492" y2="155" stroke="#f87171" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowRed)" opacity="0.6"/>
  <rect x="356" y="155" width="60" height="18" rx="9" fill="#1f0606"/>
  <text x="386" y="168" fill="#f87171" font-size="10" text-anchor="middle">$1.1M ←</text>

  <!-- BASE → SOL (inflow, orange) -->
  <line x1="494" y1="318" x2="288" y2="264" stroke="#fb923c" stroke-width="3" marker-end="url(#arrowOrange)" filter="url(#lineGlow)" opacity="0.8"/>
  <rect x="360" y="280" width="68" height="18" rx="9" fill="#1c0d00"/>
  <text x="394" y="293" fill="#fb923c" font-size="11" font-weight="600" text-anchor="middle">$1.8M →</text>

  <!-- SOL → BASE (smaller outflow) -->
  <line x1="286" y1="268" x2="494" y2="322" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRed)" opacity="0.5"/>
  <text x="380" y="308" fill="#7f2020" font-size="10">$0.7M ←</text>

  <!-- ETH → ARB -->
  <line x1="572" y1="157" x2="618" y2="208" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrowGreen)" opacity="0.6"/>
  <text x="605" y="178" fill="#6d28d9" font-size="10">$0.8M</text>

  <!-- BASE → ARB -->
  <line x1="568" y1="325" x2="618" y2="272" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrowOrange)" opacity="0.5"/>

  <!-- ── anomaly indicator ── -->
  <rect x="36" y="390" width="648" height="42" rx="8" fill="#0a0c14" stroke="#1e3a8a" stroke-width="1"/>
  <circle cx="60" cy="411" r="7" fill="#ef4444" opacity="0.8"/>
  <circle cx="60" cy="411" r="4" fill="#ef4444"/>
  <text x="78" y="407" fill="#f87171" font-size="11" font-weight="700">ANOMALY DETECTED</text>
  <text x="78" y="423" fill="#475569" font-size="11">Large transfer: $3.8M USDC from Ethereum → Solana · single wallet · 14 seconds ago · high severity</text>

  <!-- bottom caption -->
  <text x="360" y="452" fill="#0f2040" font-size="10" text-anchor="middle">nexus · wormhole · allbridge · claude agent sdk · scanning every 2 minutes</text>
</svg>
