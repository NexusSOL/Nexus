<svg width="720" height="320" viewBox="0 0 720 320" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Segoe UI','Arial',sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#040c18"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0d1f"/>
      <stop offset="100%" stop-color="#07091a"/>
    </linearGradient>
    <filter id="bglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="320" fill="url(#bg2)"/>

  <!-- severity banner -->
  <rect x="270" y="20" width="180" height="28" rx="14" fill="#1e3a8a"/>
  <text x="360" y="39" fill="#ef4444" font-size="12" font-weight="700" text-anchor="middle">⚠ HIGH SEVERITY</text>

  <!-- main card -->
  <rect x="60" y="60" width="600" height="196" rx="14" fill="url(#card)" stroke="#1e3a8a" stroke-width="1.5"/>
  <rect x="60" y="60" width="600" height="5" rx="3" fill="#ef4444" filter="url(#bglow)"/>

  <!-- type + title -->
  <text x="360" y="96" fill="#f87171" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="2">LARGE TRANSFER</text>
  <text x="360" y="122" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">$3,800,000 USDC</text>

  <!-- route diagram -->
  <rect x="120" y="138" width="80" height="32" rx="8" fill="#1e3a8a"/>
  <text x="160" y="158" fill="#93c5fd" font-size="13" font-weight="700" text-anchor="middle">Ethereum</text>
  <text x="246" y="158" fill="#475569" font-size="20">───→</text>
  <rect x="300" y="138" width="80" height="32" rx="8" fill="#1e40af"/>
  <text x="340" y="158" fill="#bfdbfe" font-size="13" font-weight="700" text-anchor="middle">Solana</text>
  <text x="400" y="158" fill="#475569" font-size="12">via Wormhole</text>

  <!-- divider -->
  <rect x="88" y="184" width="544" height="1" fill="#1e3a8a"/>

  <!-- details row -->
  <text x="160" y="206" fill="#334155" font-size="10" text-anchor="middle">SENDER</text>
  <text x="160" y="224" fill="#64748b" font-size="12" text-anchor="middle">0x7Bfa…3e9C</text>

  <text x="310" y="206" fill="#334155" font-size="10" text-anchor="middle">TIME</text>
  <text x="310" y="224" fill="#64748b" font-size="12" text-anchor="middle">14 sec ago</text>

  <text x="460" y="206" fill="#334155" font-size="10" text-anchor="middle">CONFIDENCE</text>
  <text x="460" y="224" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle">0.91</text>

  <text x="580" y="206" fill="#334155" font-size="10" text-anchor="middle">BRIDGE</text>
  <text x="580" y="224" fill="#64748b" font-size="12" text-anchor="middle">Wormhole</text>

  <!-- recommendation -->
  <rect x="88" y="238" width="544" height="1" fill="#1e3a8a"/>
  <text x="360" y="260" fill="#93c5fd" font-size="12" text-anchor="middle">Single wallet moved $3.8M in one tx — likely institutional deployment into Solana DeFi</text>
  <text x="360" y="276" fill="#22d3ee" font-size="12" font-weight="600" text-anchor="middle">→ watch for Kamino / MarginFi TVL spike in next 30 minutes</text>

  <!-- footer -->
  <text x="360" y="308" fill="#0f2040" font-size="10" text-anchor="middle">nexus · bridge anomaly detection · built with claude agent sdk</text>
</svg>
